[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-prober"
version = "0.1.0"
description = "Agentic open dataset discovery and analysis using DuckDB and Claude"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "anthropic>=0.109,<0.110",
    "beautifulsoup4>=4.13,<5",
    "cbsodata>=1.3,<2",
    "duckdb>=1.5,<2",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6.0,<7",
    "requests>=2.32,<3",
    "rich>=14,<15",
    "tavily-python>=0.7,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "responses>=0.25",
    "ruff==0.15.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that require real API calls",
    "slow: marks tests that take more than 5 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
