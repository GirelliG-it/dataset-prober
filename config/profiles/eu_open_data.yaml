# config/profiles/eu_open_data.yaml
#
# Profile for European Union open data discovery.
# Sources: European Data Portal, Eurostat, EU Open Data Portal.

name: EU Open Data
description: European Union and Eurostat open data sources
language: en
cost_warning: false

# Geographic scope
scope:
  regions:
    - European Union member states
    - EU institutions (Eurostat, European Commission)
    - European Economic Area (EEA)
  instruction: >
    You are operating as the EU Open Data profile.
    ONLY search for data from EU institutions and Eurostat.
    DO NOT attempt to find data from individual country sources
    unless they are EU member state contributions to EU datasets.
    If the user's prompt requests data from multiple regions,
    you handle ONLY the EU/Eurostat portion.

# Budget limits
budget:
  max_searches: 5
  max_crawls: 8
  max_probes: 15
  max_tokens: 4096
  timeout_minutes: 10
  sample_rows: 10
  download_timeout_seconds: 300

# Cost tracking (Claude Sonnet 4.6 pricing)
pricing:
  input_per_million: 3.00
  output_per_million: 15.00
  cache_read_per_million: 0.30

# Catalog sources
catalogs:
  - name: EU Open Data Portal
    type: ckan
    base_url: https://data.europa.eu/api/hub/search
    api_key_env: null
    timeout_seconds: 30
    priority: 1

  - name: Eurostat
    type: eurostat
    base_url: https://ec.europa.eu/eurostat/api/dissemination
    api_key_env: null
    timeout_seconds: 30
    priority: 2

# Trusted domains
trusted_domains:
  - europa.eu
  - data.europa.eu
  - ec.europa.eu
  - eurostat.ec.europa.eu
  - eea.europa.eu

# Blocked sources
blocked_sources: []

# License preferences
# EU data typically uses CC-BY 4.0
license_preference:
  - CC0
  - CC-BY
  - CC-BY-4.0
license_warn:
  - CC-BY-SA
license_reject:
  - CC-BY-NC

# Domain keywords
domain_keywords:
  population:
    - population
    - demography
    - bevolking
  economy:
    - economy
    - GDP
    - employment
  environment:
    - environment
    - emissions
    - air quality
  social:
    - social protection
    - benefits
    - poverty
