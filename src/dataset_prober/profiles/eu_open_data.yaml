# config/profiles/eu_open_data.yaml
#
# Disabled descriptor for the promised EU open-data profile.

name: EU Open Data
description: Disabled pending compatible EU Hub and Eurostat adapters
language: en
cost_warning: false
status: disabled
reason: >-
  The data.europa.eu route is incompatible with the generic /action/* CKAN adapter, and no
  Eurostat adapter is registered.

# Geographic scope
scope:
  regions:
    - European Union member states
    - EU institutions (Eurostat, European Commission)
    - European Economic Area (EEA)
  instruction: >
    This disabled descriptor records intended EU geographic selection guidance. It does
    not expose a catalog transport and does not deterministically verify geography.

# Budget limits
budget:
  max_searches: 5
  max_crawls: 8
  max_probes: 15
  max_tokens: 4096
  timeout_minutes: 10
  sample_rows: 10
  download_timeout_seconds: 300

# Cost tracking (Claude Sonnet 4.6 pricing)
pricing:
  input_per_million: 3.00
  output_per_million: 15.00
  cache_read_per_million: 0.30

# No active catalog or host policy is exposed while this profile is disabled.
catalogs: []
trusted_hosts: []
blocked_hosts: []

# License preferences
# EU data typically uses CC-BY 4.0
license_preference:
  - CC0
  - CC-BY
  - CC-BY-4.0
license_warn:
  - CC-BY-SA
license_reject:
  - CC-BY-NC

# Domain keywords
domain_keywords:
  population:
    - population
    - demography
    - bevolking
  economy:
    - economy
    - GDP
    - employment
  environment:
    - environment
    - emissions
    - air quality
  social:
    - social protection
    - benefits
    - poverty
