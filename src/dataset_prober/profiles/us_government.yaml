# config/profiles/us_government.yaml
#
# Disabled descriptor for the promised US government profile.

name: US Government
description: Disabled pending a bounded Data.gov v4 adapter and certification
language: en
cost_warning: false
status: disabled
reason: >-
  Data.gov v4 requires a source-specific adapter; the legacy v3 CKAN route is not the
  normal v0.1 release target.

# Geographic scope
scope:
  regions:
    - United States of America
    - US federal government agencies
    - US states and territories
    - US counties and municipalities
  instruction: >
    This disabled descriptor records intended US geographic selection guidance. It does
    not expose a catalog transport and does not deterministically verify geography.

# Budget limits
budget:
  max_searches: 5
  max_crawls: 8
  max_probes: 15
  max_tokens: 4096
  timeout_minutes: 10
  sample_rows: 10
  download_timeout_seconds: 300

# Cost tracking (Claude Sonnet 4.6 pricing)
pricing:
  input_per_million: 3.00
  output_per_million: 15.00
  cache_read_per_million: 0.30

# No active catalog or host policy is exposed while this profile is disabled.
catalogs: []
trusted_hosts: []
blocked_hosts: []

# License preferences
# US federal government works are public domain by default (17 U.S.C. § 105)
license_preference:
  - CC0
  - US-PD       # US Government Public Domain
  - other-pd    # Other public domain designations
license_warn:
  - CC-BY
  - CC-BY-SA
license_reject:
  - CC-BY-NC

# Domain keywords for query expansion
domain_keywords:
  population:
    - population
    - demographics
    - census
  economy:
    - economy
    - income
    - employment
    - labor
  social:
    - social security benefits
    - supplemental security income
    - disability insurance
    - retirement benefits
    - medicare medicaid
    - welfare assistance
    - social insurance CMS
    - social insurance BLS
  environment:
    - environment
    - air quality
    - climate
