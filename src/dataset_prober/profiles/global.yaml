# config/profiles/global.yaml
#
# Disabled descriptor for the promised global-discovery profile.

name: Global Discovery
description: >
  Disabled because no supported and certified safe discovery transport is available.
language: auto
cost_warning: true
status: disabled
reason: >-
  No supported and certified safe discovery transport is available to the Global profile
  in v0.1.

# Geographic scope
scope:
  regions:
    - Worldwide — no geographic restriction
  instruction: >
    This disabled descriptor records worldwide selection guidance. It exposes no discovery
    transport and does not deterministically verify geographic relevance or credibility.

warning_message: |
  ⚠️  Global Discovery Mode

  This profile is disabled because no supported and certified safe discovery transport is
  available in v0.1.

# Budget limits — more generous for global search
budget:
  max_searches: 10
  max_results: 20
  max_probes: 20
  max_model_calls: 40
  max_tokens: 8192
  max_total_tokens: 100000
  timeout_minutes: 20
  sample_rows: 10
  download_timeout_seconds: 300

# Cost tracking (Claude Sonnet 4.6 pricing)
pricing:
  input_per_million: 3.00
  output_per_million: 15.00
  cache_read_per_million: 0.30

# No active catalog or host policy is exposed while this profile is disabled.
catalogs: []
trusted_hosts: []
blocked_hosts: []

# License preferences
license_preference:
  - CC0
  - CC-BY
  - US-PD
license_warn:
  - CC-BY-SA
license_reject:
  - CC-BY-NC
