# config/profiles/global.yaml
#
# Profile for global open data discovery.
# No preset sources — uses Tavily web search to find datasets worldwide.
# WARNING: This profile is slower and more expensive than targeted profiles.

name: Global Discovery
description: >
  Unrestricted global open data discovery using web search.
  No preset sources — the agent discovers authoritative sources from your prompt.
language: auto
cost_warning: true

# Geographic scope
scope:
  regions:
    - Worldwide — no geographic restriction
  instruction: >
    You are operating as the Global Discovery profile.
    Search worldwide without geographic restriction.
    Evaluate source credibility using the credibility_signals in this profile.
    Prefer sources with high credibility signals (.gov, .org, UN, World Bank, WHO).

warning_message: |
  ⚠️  Global Discovery Mode

  This profile uses web search to find data sources worldwide.
  It may take significantly longer and consume more API credits
  than a targeted profile (Dutch Government, US Government, etc.).

  Estimated additional cost: 2-5x compared to targeted profiles.

  If your data is from a specific country or organization,
  consider using a targeted profile instead for better results.

  Continue with Global Discovery? (Y/n):

# Budget limits — more generous for global search
budget:
  max_searches: 10
  max_crawls: 15
  max_probes: 20
  max_tokens: 8192
  timeout_minutes: 20
  sample_rows: 10
  download_timeout_seconds: 300

# Cost tracking (Claude Sonnet 4.6 pricing)
pricing:
  input_per_million: 3.00
  output_per_million: 15.00
  cache_read_per_million: 0.30

# No preset catalogs — agent discovers sources via Tavily
catalogs: []

# No preset trusted domains — agent evaluates source credibility
trusted_domains: []

# Blocked sources — known problematic sites
blocked_sources:
  - denhaag.incijfers.nl

# License preferences
license_preference:
  - CC0
  - CC-BY
  - US-PD
license_warn:
  - CC-BY-SA
license_reject:
  - CC-BY-NC

# Source credibility signals — agent uses these to evaluate found sources
credibility_signals:
  high:
    - .gov
    - .gov.uk
    - .gov.au
    - europa.eu
    - un.org
    - worldbank.org
    - who.int
    - oecd.org
  medium:
    - .org
    - github.com
    - kaggle.com
  low:
    - .com
    - unknown
