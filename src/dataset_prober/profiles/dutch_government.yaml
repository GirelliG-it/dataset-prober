# config/profiles/dutch_government.yaml
#
# Manual-only profile for supported Dutch national catalog routes.

name: Dutch Government
description: >-
  Manual-only discovery through CBS StatLine OData v3 and data.overheid.nl CKAN v3
language: nl
cost_warning: false
status: manual_only
reason: >-
  The CBS StatLine OData v3 and data.overheid.nl CKAN v3 routes are available only by
  explicit selection during v0.1 stabilization.

# Geographic scope is selection guidance, not deterministic semantic verification.
scope:
  regions:
    - Netherlands
    - Dutch municipalities (gemeenten)
    - Dutch provinces (provincies)
    - Kingdom of the Netherlands (including Caribbean municipalities)
  instruction: >
    This profile exposes the configured CBS StatLine and data.overheid.nl catalogs. Treat
    the requested Dutch geographic scope as selection guidance, not deterministic proof of
    relevance, and report the deterministic assessment for every inspected resource.

# Enforced profile-agent run budgets
budget:
  max_searches: 5
  max_results: 10
  max_probes: 15
  max_model_calls: 24
  max_tokens: 4096
  max_total_tokens: 50000
  timeout_minutes: 10
  sample_rows: 10
  download_timeout_seconds: 300

# Cost tracking (Claude Sonnet 4.6 pricing)
pricing:
  input_per_million: 3.00
  output_per_million: 15.00
  cache_read_per_million: 0.30

# Active catalog sources — searched in order
catalogs:
  - catalog_id: cbs_statline
    adapter: cbs
    name: CBS Statistics Netherlands
    base_url: https://opendata.cbs.nl/ODataCatalog
    api_key_env: null
    timeout_seconds: 30
    priority: 1
    required: true
  - catalog_id: data_overheid
    adapter: ckan
    name: Dutch National Data Portal
    base_url: https://data.overheid.nl/data/api/3
    api_key_env: null
    timeout_seconds: 30
    priority: 2
    required: true
    ckan_dialect: ckan_action
    ckan_search_mode: local_resource_metadata
    landing_base_url: https://data.overheid.nl

# Host rules support catalog guidance only; guarded transport remains authoritative.
trusted_hosts:
  - hostname: opendata.cbs.nl
    include_subdomains: false
  - hostname: data.overheid.nl
    include_subdomains: false
blocked_hosts: []

# License preferences (CCREL/ODRL)
# Agent will flag datasets not matching preferred licenses
license_preference:
  - CC0
  - CC-BY
license_warn:
  - CC-BY-SA
license_reject:
  - CC-BY-NC

# Search keywords — agent uses these to expand user queries
# Format: [dutch_term, english_term]
domain_keywords:
  population:
    - bevolking
    - inwoners
    - demografie
  economy:
    - economie
    - inkomen
    - arbeidsmarkt
  environment:
    - milieu
    - luchtkwaliteit
    - klimaat
  social:
    - sociale zekerheid
    - uitkeringen
    - zorg
