# config/profiles/dutch_government.yaml
#
# Manual-only profile for the supported CBS StatLine OData v3 route.

name: Dutch Government (CBS only)
description: Manual-only discovery through the supported CBS StatLine OData v3 catalog
language: nl
cost_warning: false
status: manual_only
reason: >-
  Only the supported CBS StatLine OData v3 route is exposed; broader Dutch catalogue
  discovery awaits repair and certification.

# Geographic scope is selection guidance, not deterministic semantic verification.
scope:
  regions:
    - Netherlands
    - Dutch municipalities (gemeenten)
    - Dutch provinces (provincies)
    - Kingdom of the Netherlands (including Caribbean municipalities)
  instruction: >
    This profile exposes only the configured CBS StatLine catalog. Treat the requested
    Dutch geographic scope as selection guidance and report the deterministic assessment
    for every inspected resource.

# Budget limits — all values controlled by end-user via CLI flags
# These are profile suggestions, not enforced defaults
budget:
  max_searches: 5
  max_crawls: 8
  max_probes: 15
  max_tokens: 4096
  timeout_minutes: 10
  sample_rows: 10
  download_timeout_seconds: 300

# Cost tracking (Claude Sonnet 4.6 pricing)
pricing:
  input_per_million: 3.00
  output_per_million: 15.00
  cache_read_per_million: 0.30

# Active catalog sources — searched in order
catalogs:
  - catalog_id: cbs_statline
    adapter: cbs
    name: CBS Statistics Netherlands
    base_url: https://opendata.cbs.nl/ODataCatalog
    api_key_env: null
    timeout_seconds: 30
    priority: 1
    required: true

# Host rules support catalog guidance only; guarded transport remains authoritative.
trusted_hosts:
  - hostname: opendata.cbs.nl
    include_subdomains: false
blocked_hosts: []

# License preferences (CCREL/ODRL)
# Agent will flag datasets not matching preferred licenses
license_preference:
  - CC0
  - CC-BY
license_warn:
  - CC-BY-SA
license_reject:
  - CC-BY-NC

# Search keywords — agent uses these to expand user queries
# Format: [dutch_term, english_term]
domain_keywords:
  population:
    - bevolking
    - inwoners
    - demografie
  economy:
    - economie
    - inkomen
    - arbeidsmarkt
  environment:
    - milieu
    - luchtkwaliteit
    - klimaat
  social:
    - sociale zekerheid
    - uitkeringen
    - zorg
